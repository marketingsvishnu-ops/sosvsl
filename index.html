<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>IND vs WI Live Cricket Score</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    color: #172033;
}

/* TOP HEADER */
.header {
    background: linear-gradient(135deg, #071b4a, #123b8f);
    color: white;
    padding: 25px 6%;
}

.header-inner {
    max-width: 1300px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 30px;
    font-weight: 900;
}

.live {
    background: #e53935;
    padding: 8px 15px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: bold;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        opacity: .5;
    }
}

/* HERO */
.hero {
    background: linear-gradient(135deg, #071b4a, #1749aa);
    color: white;
    padding: 40px 6% 70px;
}

.hero-content {
    max-width: 1300px;
    margin: auto;
    text-align: center;
}

.series {
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: .8;
    font-size: 14px;
}

.match-title {
    font-size: 42px;
    font-weight: 900;
    margin: 15px 0;
}

.venue {
    opacity: .85;
}

.score-card {
    max-width: 1100px;
    margin: -40px auto 30px;
    background: white;

    padding: 35px;

    position: relative;
    z-index: 2;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 1.2fr 1fr;
    align-items: center;
    gap: 20px;
}

.team {
    text-align: center;
}

.flag {
    font-size: 65px;
}

.team-name {
    font-size: 25px;
    font-weight: 800;
    margin-top: 10px;
}

.score {
    text-align: center;
}

.runs {
    font-size: 62px;
    font-weight: 900;
}

.overs {
    font-size: 18px;
    color: #667085;
    margin-top: 5px;
}

.status {
    display: inline-block;
    margin-top: 18px;

    padding: 10px 18px;
    border-radius: 30px;

}

/* CONTENT */
.container {
    max-width: 1300px;
    margin: auto;
    padding: 0 20px 60px;
}

.grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 25px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-bottom: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.card h2 {
    margin-bottom: 20px;
    font-size: 23px;
}
